[package]
name = "messagerie-api"
version = "0.1.0"
edition = "2021"
description = "API de messagerie chiffrée de bout en bout (Actix-web). Ne manipule que du chiffré."
license = "MIT"

[[bin]]
name = "messagerie-api"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing"] }
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
actix-http = "3"
