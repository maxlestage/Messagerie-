# project.yml — spécification XcodeGen de Brocolis 🥦
#
# Régénère Brocolis.xcodeproj de façon déclarative :  `xcodegen generate`
# (installe XcodeGen avec `brew install xcodegen`).
#
# Fini les modifications manuelles du pbxproj : on décrit les cibles ici, et
# le projet est reconstruit à l'identique. Idéal pour Xcode Cloud (voir
# docs/XCODE_CLOUD.md).

name: Brocolis

options:
  bundleIdPrefix: rs.brocolis.messagerie
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: fr
  createIntermediateGroups: true

# Réglages communs à toutes les cibles.
settings:
  base:
    DEVELOPMENT_TEAM: "2FW8T4UX4L"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES

targets:

  # ── Application hôte ──────────────────────────────────────────────
  Brocolis:
    type: application
    platform: iOS
    sources:
      - path: Brocolis
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rs.brocolis.messagerie
        CODE_SIGN_ENTITLEMENTS: Brocolis/Brocolis.entitlements
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Brocolis 🥦 messageries"
        # NO = pas de chiffrement NON exempté. Brocolis n'utilise que du
        # chiffrement standard fourni par Apple (CryptoKit : AES-GCM, X25519),
        # donc EXEMPTÉ. Mettre YES sans fournir de code de conformité
        # (ITSEncryptionExportComplianceCode) provoque le rejet ITMS-90592.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSContactsUsageDescription: "Brocolis lit tes contacts pour choisir un correspondant par son nom et son numéro. Rien n'est envoyé : tout reste sur ton iPhone."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Brocolis enregistre ta voix uniquement pour créer un message vocal chiffré. Rien ne part sans chiffrement."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: BrocolisAction
      - target: BrocolisStatus
      - target: BrocolisKeyboard
      - target: BrocolisiMessage

  # ── Extension Partager (Action) ───────────────────────────────────
  BrocolisAction:
    type: app-extension
    platform: iOS
    sources:
      - path: BrocolisAction
      - path: Shared/BrocolisCrypto.swift
      - path: Shared/BrocolisKeyStore.swift
      - path: Shared/BrocolisTransform.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rs.brocolis.messagerie.action
        CODE_SIGN_ENTITLEMENTS: BrocolisAction/BrocolisAction.entitlements
        INFOPLIST_FILE: BrocolisAction/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  # ── Widget + Live Activity (Status) ───────────────────────────────
  BrocolisStatus:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: BrocolisStatus
      - path: Shared/BrocolisCrypto.swift
      - path: Shared/BrocolisKeyStore.swift
      - path: Shared/BrocolisKeyAgreement.swift
      - path: Shared/BrocolisActivityAttributes.swift
      - path: Shared/BrocolisWidgetIntents.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rs.brocolis.messagerie.status
        CODE_SIGN_ENTITLEMENTS: BrocolisStatus/BrocolisStatus.entitlements
        INFOPLIST_FILE: BrocolisStatus/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  # ── Mini-app iMessage (envoyer chiffré / lire au tap sur la bulle) ─
  BrocolisiMessage:
    type: app-extension.messages
    platform: iOS
    sources:
      - path: BrocolisiMessage
      - path: Shared/BrocolisCrypto.swift
      - path: Shared/BrocolisKeyStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rs.brocolis.messagerie.imessage
        CODE_SIGN_ENTITLEMENTS: BrocolisiMessage/BrocolisiMessage.entitlements
        INFOPLIST_FILE: BrocolisiMessage/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "iMessage App Icon"
        # Apple exige qu'une extension Messages cible iPhone ET iPad (validation
        # App Store), même si l'app conteneur est iPhone-only.
        TARGETED_DEVICE_FAMILY: "1,2"

  # ── Clavier personnalisé ──────────────────────────────────────────
  BrocolisKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: BrocolisKeyboard
      - path: Shared/BrocolisCrypto.swift
      - path: Shared/BrocolisKeyStore.swift
      - path: Shared/BrocolisTransform.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rs.brocolis.messagerie.keyboard
        CODE_SIGN_ENTITLEMENTS: BrocolisKeyboard/BrocolisKeyboard.entitlements
        INFOPLIST_FILE: BrocolisKeyboard/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  # ── Tests unitaires (XCTest, @testable import Brocolis) ───────────
  BrocolisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BrocolisTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rs.brocolis.messagerie.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Brocolis

# Scheme partagé (requis par Xcode Cloud) : build l'app + lance les tests.
schemes:
  Brocolis:
    build:
      targets:
        Brocolis: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BrocolisTests
    archive:
      config: Release
