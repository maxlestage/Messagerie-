[package]
name = "brocolis-site"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
description = "Vitrine Brocolis 🥦 messageries — écrite avec Active (rendu serveur + îlots WebAssembly), servie par l'App Paquets du serveur"
publish = false

# Crate indépendante : le serveur (`../server-rust`) en dépend pour rendre les
# pages ; compilée en WebAssembly, elle devient le code du navigateur.
[workspace]

[lib]
name = "brocolis_site"
crate-type = ["cdylib", "rlib"]

[dependencies]
active = { git = "https://github.com/maxlestage/Active" }
# Discussion en ligne : la MÊME cryptographie que l'app (X25519, HKDF-SHA256,
# AES-256-GCM), dans le navigateur.
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Le protocole v3 (docs/SECURITE.md) : la référence Rust du dépôt, par son
# chemin (une seule source, la même que les vecteurs des portages).
# `serde_json` lit et écrit les états qu'elle sauve (appareil, sessions).
brocolis-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Les pages sont servies par Vitesse (routes ajoutées à l'app du serveur).
vitesse = { git = "https://github.com/maxlestage/Vitesse", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
active = { git = "https://github.com/maxlestage/Active", features = ["client"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "AbortController",
  "AbortSignal",
  "AddEventListenerOptions",
  "AudioBuffer",
  "AudioContext",
  "AudioDestinationNode",
  "AudioNode",
  "AudioProcessingEvent",
  "BaseAudioContext",
  "Blob",
  "CanvasRenderingContext2d",
  "Clipboard",
  "Crypto",
  "CryptoKey",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "DomTokenList",
  "Element",
  "EventSource",
  "EventTarget",
  "File",
  "FileList",
  "Headers",
  "History",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlDocument",
  "HtmlElement",
  "HtmlImageElement",
  "HtmlInputElement",
  "IdbDatabase",
  "IdbFactory",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "ImageData",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "KeyboardEvent",
  "Location",
  "MediaDevices",
  "MediaQueryList",
  "MediaStream",
  "MediaStreamAudioSourceNode",
  "MediaStreamConstraints",
  "MediaStreamTrack",
  "MessageEvent",
  "MouseEvent",
  "Navigator",
  "NodeList",
  "Performance",
  "PointerEvent",
  "RequestInit",
  "Response",
  "ScriptProcessorNode",
  "ScrollBehavior",
  "ScrollToOptions",
  "Storage",
  "SubtleCrypto",
  "TextMetrics",
  "Url",
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlProgram",
  "WebGlShader",
  "WebGlUniformLocation",
  "Window",
] }

# Le code du navigateur :
# `cargo build --lib --target wasm32-unknown-unknown --profile wasm-release`.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
