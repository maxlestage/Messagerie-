<!doctype html>
<html lang="fr" data-theme="green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Brocolis 🥦 messageries — chiffrement sélectif</title>
    <meta
      name="description"
      content="Brocolis 🥦 : ajoute le chiffrement sélectif de brocolis à tes apps de messagerie iOS via une extension de partage. Appairage automatique X25519, clé de groupe, expiration."
    />
    <meta name="theme-color" content="#2f9e4a" />
    <meta name="color-scheme" content="light dark" />

    <!-- Vignette de partage (Open Graph / Twitter). URLs ABSOLUES : les robots
         d'aperçu n'exécutent pas le WebAssembly, ces balises statiques font foi. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Brocolis 🥦 messageries" />
    <meta property="og:url" content="https://brocolis-serveur-839b43057467.herokuapp.com/" />
    <meta property="og:title" content="Brocolis 🥦 messageries" />
    <meta property="og:description" content="Chiffrement sélectif pour tes messageries, bâti sur brocolis." />
    <meta property="og:image" content="https://brocolis-serveur-839b43057467.herokuapp.com/photo.png" />
    <meta property="og:image:width" content="640" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="Brocolis 🥦 messageries" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Brocolis 🥦 messageries" />
    <meta name="twitter:description" content="Chiffrement sélectif pour tes messageries, bâti sur brocolis." />
    <meta name="twitter:image" content="https://brocolis-serveur-839b43057467.herokuapp.com/photo.png" />

    <link rel="icon" type="image/png" href="./photo.png" />
    <link rel="apple-touch-icon" href="./photo.png" />

    <!-- Thème et langue appliqués AVANT le chargement du WebAssembly : pas de
         flash de la mauvaise couleur au premier affichage. -->
    <script>
      try {
        var t = localStorage.getItem("messagerie.theme");
        if (t === "green" || t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        var l = localStorage.getItem("messagerie.lang");
        if (l === "fr" || l === "en" || l === "es") document.documentElement.lang = l;
      } catch (e) {}
    </script>

    <!-- Assets gérés par Trunk. wasm-opt reçoit les fonctionnalités WebAssembly
         activées par défaut dans Rust (bulk memory, sign-ext, etc.). -->
    <link
      data-trunk
      rel="rust"
      data-wasm-opt="z"
      data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue"
    />
    <link data-trunk rel="css" href="style.css" />
    <link data-trunk rel="copy-file" href="public/photo.png" />
    <link data-trunk rel="copy-file" href="../README.md" />
  </head>
  <body>
    <!-- Rideau d'ouverture : la marque se trace pendant que le WebAssembly se
         charge ; fx::lift_curtain le lève une fois l'app montée. -->
    <div id="splash" class="curtain" aria-hidden="true">
      <svg class="curtain-mark" viewBox="0 0 600 160">
        <text x="300" y="80" text-anchor="middle" dominant-baseline="central">Brocolis</text>
      </svg>
      <div class="curtain-count"><span class="curtain-n"></span><i>%</i></div>
    </div>
    <div class="grain" aria-hidden="true"></div>
    <div id="app"></div>
    <noscript>
      <p style="padding:24px;text-align:center">
        Brocolis 🥦 messageries — ce site a besoin de JavaScript / WebAssembly.
        Voir le dépôt : <a href="https://github.com/maxlestage/Messagerie-">github.com/maxlestage/Messagerie-</a>
      </p>
    </noscript>
  </body>
</html>
