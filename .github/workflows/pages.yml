name: Site (Yew) — tests et déploiement GitHub Pages

# Vitrine en Rust/WebAssembly (Yew), construite par Trunk.
# - Sur une PR : tests + build (rien n'est publié).
# - Sur master : tests + build + déploiement GitHub Pages.
on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul run par branche ; un build de PR n'annule jamais un déploiement.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  TRUNK_VERSION: 0.21.14

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site

      - name: Installer Trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin trunk
          trunk --version

      - name: Tests (i18n, rendu Markdown)
        working-directory: site
        run: cargo test --locked

      - name: Construire le site
        working-directory: site
        run: trunk build --release --locked

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
        with:
          enablement: true   # active GitHub Pages (source = Actions) au 1er run

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
