name: API tests

# Compile et teste l'API de messagerie chiffrée (Rust + Actix-web). Tourne quand
# server-rust/ change.
on:
  # Économie de minutes Actions (dépôt privé) : on ne lance QU'UNE fois par
  # changement — sur les PR, et sur master après merge. Plus de double run
  # (push + pull_request) sur chaque push de branche.
  push:
    branches: [master]
    paths:
      - 'server-rust/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'server-rust/**'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres jetable : les tests d'intégration /v1/* tournent contre une vraie
    # base (sinon ils se sautent proprement). TEST_DATABASE_URL les active.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brocolis
          POSTGRES_PASSWORD: brocolis
          POSTGRES_DB: brocolis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brocolis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://brocolis:brocolis@localhost:5432/brocolis
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rust
      - name: Build
        working-directory: server-rust
        run: cargo build --verbose
      - name: Tests (unitaires + intégration Postgres)
        working-directory: server-rust
        run: cargo test --verbose
