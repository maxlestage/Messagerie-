name: API tests

# Compile et teste le serveur Brocolis (Vitesse + Memoire, avec les pages du
# site Active). Plus de Postgres jetable : les données sont en mémoire, les
# tests d'intégration tournent partout. Tourne quand server-rust/ ou site/
# change (le serveur rend les pages du site).
on:
  # Économie de minutes Actions (dépôt privé) : on ne lance QU'UNE fois par
  # changement — sur les PR, et sur master après merge.
  push:
    branches: [master]
    paths:
      - 'server-rust/**'
      - 'site/**'
      - 'README.md'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'server-rust/**'
      - 'site/**'
      - 'README.md'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server-rust
      - name: Build
        working-directory: server-rust
        run: cargo build --locked
      - name: Tests (unitaires + intégration, flux SSE compris)
        working-directory: server-rust
        run: cargo test --locked
