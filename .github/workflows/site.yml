name: Site (Active) — tests et build

# Vitrine en Rust avec Active : pages rendues par le serveur, îlots et
# animations compilés en WebAssembly. Elle est publiée par le serveur Heroku
# (Dockerfile) ; ce workflow vérifie qu'elle compile des deux côtés et que ses
# tests passent.
on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'README.md'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'README.md'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  WASM_BINDGEN_VERSION: 0.2.129

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site

      - name: Installer wasm-bindgen
        run: |
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen"
          wasm-bindgen --version

      - name: Tests (textes, adresses, démo, rendu des pages)
        working-directory: site
        run: cargo test --locked

      - name: Clippy (navigateur)
        working-directory: site
        run: cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings

      - name: Construire le code du navigateur
        working-directory: site
        run: |
          cargo build --locked --lib --target wasm32-unknown-unknown --profile wasm-release
          wasm-bindgen --target web --no-typescript --out-dir pkg target/wasm32-unknown-unknown/wasm-release/brocolis_site.wasm
          ls -la pkg
