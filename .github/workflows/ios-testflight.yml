name: iOS TestFlight

# Build signé + téléversement TestFlight de l'app Brocolis 🥦.
#
# Signature « cloud » (automatique) via une clé API App Store Connect : aucun
# certificat ni profil à gérer à la main, `xcodebuild -allowProvisioningUpdates`
# les crée/récupère à la volée. L'étape d'export téléverse directement sur App
# Store Connect (ExportOptions.plist : destination = upload).
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   ASC_KEY_ID     — identifiant de la clé API (ex. ABC123DEF4)
#   ASC_ISSUER_ID  — Issuer ID (UUID) de App Store Connect
#   ASC_KEY_P8     — contenu du fichier .p8 (clé privée, multi-lignes)
# Voir docs/ios-testflight.md pour la marche à suivre complète.

on:
  # Automatique : chaque fois que « iOS build & tests » passe au vert sur
  # master (donc après chaque merge qui touche l'app), un build part vers
  # TestFlight. Rien ne part si les tests échouent.
  workflow_run:
    workflows: ['iOS build & tests']
    types: [completed]
    branches: [master]
  push:
    tags: ['v*'] # ex. v1.0.0 : le tag déclenche aussi une livraison TestFlight.
  workflow_dispatch: # déclenchement manuel possible.

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Build & Upload TestFlight
    # App Store exige un build avec le SDK iOS 26 (Xcode 26) : runner récent +
    # sélection de la dernière version stable de Xcode.
    runs-on: macos-15
    timeout-minutes: 45
    # Après les tests : seulement s'ils ont réussi, sur un push vers master.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      - uses: actions/checkout@v7
        with:
          # Après les tests : le commit exactement testé, pas le dernier master.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Sélectionner Xcode (dernier stable = Xcode 26+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Versions Xcode / SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Écrire la clé API App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Secret ASC_KEY_P8 manquant (voir docs/ios-testflight.md)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Numéro de build
        id: build
        # Numéro monotone dérivé du run CI (décalé pour rester > builds manuels).
        run: echo "number=$(( ${{ github.run_number }} + 1000 ))" >> "$GITHUB_OUTPUT"

      - name: Archive (signature cloud automatique)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Brocolis.xcodeproj \
            -scheme Brocolis \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Brocolis.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ steps.build.outputs.number }}

      - name: Export + upload TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Brocolis.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Nettoyer la clé API
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
