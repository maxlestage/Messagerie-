name: CI Swift (build + tests)

# Valide le code Swift : compile l'app + toutes les extensions et lance la suite
# XCTest sur simulateur iOS. Tourne à chaque push/PR qui touche du Swift ou le
# projet Xcode.
on:
  push:
    branches: ['**']
    paths:
      - '**/*.swift'
      - 'Brocolis.xcodeproj/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**/*.swift'
      - 'Brocolis.xcodeproj/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# Une seule exécution par branche : on annule la précédente si on repousse.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (iOS Simulator)
    # macos-latest suit toujours une image macOS supportée (les images figées
    # comme macos-14 finissent par être retirées, d'où des jobs qui échouent
    # instantanément faute de runner).
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Versions Xcode / SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i simulator || true

      - name: Lister le projet
        run: xcodebuild -list -project Brocolis.xcodeproj

      - name: Choisir un simulateur iPhone disponible
        id: sim
        run: |
          set -e
          name=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+( Pro)?( Max)?( Plus)?' \
            | head -1)
          if [ -z "$name" ]; then
            echo "::error::Aucun simulateur iPhone disponible sur le runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Simulateur retenu : $name"

      - name: Build & Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Brocolis.xcodeproj \
            -scheme Brocolis \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -resultBundlePath TestResults.xcresult \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Archiver les résultats de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
