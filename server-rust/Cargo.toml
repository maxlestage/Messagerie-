[package]
name = "brocolis-messagerie"
version = "0.1.0"
edition = "2021"
description = "API messagerie Brocolis 🥦 en Rust (Actix-web + SeaORM). Ne stocke que du chiffré."
license = "UNLICENSED"

# Portage Rust du serveur Node (server/). En PARALLÈLE : la prod reste le Node
# tant que ce service n'est pas prouvé. Cœur d'abord (messagerie + Postgres) ;
# rendez-vous X25519, SSE, APNs et Redis à porter ensuite.

[dependencies]
actix-web = "4"
actix-files = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
sea-orm = { version = "1.1", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
