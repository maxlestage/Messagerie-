[package]
name = "brocolis-messagerie"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Serveur Brocolis 🥦, écrit avec Paquets : API de messagerie chiffrée et rendez-vous X25519 (Vitesse), bouclier (Securite), données en mémoire (Memoire), site (Active). Ne stocke que du chiffré."
license = "UNLICENSED"
publish = false

# Tout le serveur est dans la bibliothèque (testable sans ouvrir de port) ; le
# binaire ne fait que la démarrer.
[lib]
name = "brocolis_messagerie"
path = "src/lib.rs"

[[bin]]
name = "brocolis-messagerie"
path = "src/main.rs"

[dependencies]
# Le framework full-stack : Vitesse (le web) + Securite (le bouclier) + Memoire + Active.
paquets = { git = "https://github.com/maxlestage/Paquets", default-features = false }
# Le framework web (façon Express) : routes, SSE, CORS, fichiers statiques.
vitesse = { git = "https://github.com/maxlestage/Vitesse", default-features = false }
# Les données, en mémoire : ni Postgres ni Redis.
memoire-orm = { git = "https://github.com/maxlestage/Memoire" }
# Le site, écrit avec Active : ses pages sont rendues par ce serveur.
brocolis-site = { path = "../site" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }

[dev-dependencies]
# Tests de « Se connecter avec Apple » : paire RSA générée à la volée.
rsa = "0.9.10"
rand = "0.8.5"

# Génération de clé RSA rapide même en build de test.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
# Pas de `panic = "abort"` : Vitesse change une panique en réponse 500, le
# serveur reste debout.
